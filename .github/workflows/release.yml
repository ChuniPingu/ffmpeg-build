name: Release Windows FFmpeg
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: ffmpeg-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg-configuration.json -Raw | ConvertFrom-Json).'default-registry'.baseline
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP/vcpkg"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          git -C "$env:RUNNER_TEMP/vcpkg" checkout $baseline

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" >> $env:GITHUB_ENV
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1 -ReleaseTag $env:GITHUB_REF_NAME -Repository $env:GITHUB_REPOSITORY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-release-${{ github.ref_name }}
          path: artifacts/${{ github.ref_name }}/*
          if-no-files-found: error
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem "artifacts/$env:GITHUB_REF_NAME" -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @files --repo $env:GITHUB_REPOSITORY --verify-tag --title "FFmpeg $env:GITHUB_REF_NAME"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
